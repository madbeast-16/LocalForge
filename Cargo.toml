[package]
name = "llama-install"
version = "0.2.0"
edition = "2021"
description = "Zero-overhead TUI tool to install and configure llama.cpp with optimal hardware-aware settings"
authors = ["llama-install"]
license = "MIT"
repository = "https://github.com/AlexsJones/llama-install"
homepage = "https://github.com/AlexsJones/llama-install"
readme = "README.md"
keywords = ["llama", "llm", "gguf", "tui", "installer"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.70"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Hardware detection
sysinfo = "0.38"
nvml-wrapper = "0.10"

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP (blocking, no async runtime needed)
ureq = { version = "2", features = ["json"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"

# Utilities
dirs = "5"
shellexpand = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
